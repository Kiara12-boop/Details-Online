<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ND - Sign Up Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .topbar-signup {
      background-color: grey;
      padding: 16px 32px;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .wire-input {
      background-color: lightgray;
      border: none;
      border-radius: 10px;
      height: 38px;
      padding: 6px 14px;
    }

    .wire-input:focus {
      background-color: whitesmoke;
      box-shadow: none;
      outline: 2px solid grey;
    }

    .check-verified {
      color: green;
      font-size: 45px;
      line-height: 1;
    }

    .date-input {
      width: 82px;
      height: 52px;
      border: 2px solid grey;
      border-radius: 10px;
      text-align: center;
      color: grey;
    }

    .date-input:focus {
      border-color: #000;
      box-shadow: none;
    }

    .btn-wire {
      background-color: #c7cfd6;
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 12px 36px;
      font-size: 1.2rem;
      font-weight: 500;
    }

    .btn-wire:hover {
      background-color: #b5bec7;
      color: #000;
    }
  </style>
</head>
<body>

  <header class="topbar-signup">
    Sign Up Page
  </header>

  <main class="container py-4 py-md-5">
    <div class="row align-items-center justify-content-center">
      <div class="col-md-4 text-center">
        <img src="http://localhost/works/details-online/img/logo.png">
        <div class="fw-bold fs-4 mt-3">Toko karpet</div>
      </div>
      
      <!-- Kanan / Utama -->
      <div class="col-12 col-md-7 col-lg-6">
        <h2 class="fw-bold mb-3">Sign up here:</h2>

        <form id="signupForm">
          <div class="mb-3" style="max-width: 420px;">
            <label for="email" class="form-label fs-5 mb-1">Email:</label>
            <input type="text" id="email" class="form-control wire-input">
          </div>

          <div class="mb-3" style="max-width: 420px;">
            <label for="username" class="form-label fs-5 mb-1">Username:</label>
            <input type="text" id="username" class="form-control wire-input">
          </div>

          <div class="mb-3" style="max-width: 420px;">
            <label for="phone" class="form-label fs-5 mb-1">Phone Number:</label>
            <input type="text" id="phone" class="form-control wire-input">
          </div>

          <div class="mb-3">
            <label class="form-label fs-5 mb-1">Birthdate:</label>
            <div class="d-flex gap-2 gap-sm-3">
              <input type="text" class="form-control date-input" placeholder="DD" maxlength="2">
              <input type="text" class="form-control date-input" placeholder="MM" maxlength="2">
              <input type="text" class="form-control date-input" placeholder="YYYY" maxlength="4">
            </div>
          </div>

          <div class="mb-3" style="max-width: 420px;">
            <label for="password" class="form-label fs-5 mb-1">Password:</label>
            <input type="password" id="password" class="form-control wire-input">
          </div>

          <div class="mb-4" style="max-width: 420px;">
            <label for="verifyPassword" class="form-label fs-5 mb-1">Verify Password:</label>
            <input type="password" id="verifyPassword" class="form-control wire-input">
            <p id="message"></p>
          </div>

            <div class="d-flex justify-content-end" style="max-width: 420px;">
            <button id="sub" type="submit" class="btn btn-wire">Sign Up</button>
            
            <script>
            const password = document.getElementById("password");
            const verifyPassword = document.getElementById("verifyPassword");
            const message = document.getElementById("message");
            const gas = 0
            
            document.getElementById("sub").addEventListener("click", function(event) {
              if (password.value != verifyPassword.value) {
                event.preventDefault();
                message.textContent = "Passwords do not match!";
                message.style.color = "red";
              } 
              else {
                message.textContent = "Passwords match!";
                message.style.color = "green";
                gas = 1;
              }
            });
            </script> 
          </div>
        </form>
      </div>
    </div>
  </main>
  
  <script>
  $(document).ready(function() {
    $("#signupForm").submit(function(e) {

        e.preventDefault();
        let form = this;

        // Mengambil data form biasa menggunakan serializeArray()
        let dataForm = $(form).serializeArray();

        // Membuat FormData untuk menampung data dan file
        let formData = new FormData();

        $.each(dataForm, function(i, field) {
            formData.append(field.name, field.value);
        });

        // Memasukkan semua file ke FormData
        $(form).find('input[type="file"]').each(function() {

          if (this.files.length > 0) {
            $.each(this.files, function(i, file) {
              formData.append("files[]", file);
            });
          }
      });

      $.ajax({

        url: "test.php",
        type: "POST",
        data: formData,

        processData: false,
        contentType: false,
        dataType: "json",

        success: function(response) {
          if (response.status === "success") {
                    $("#hasil").html(
                        "<p style='color:green'>" +
                        response.message + "</p>"
                    );

                    form.reset();

                    // Kembalikan input file menjadi satu
                    $("#fileContainer .file-input:not(:first)")
                        .remove();
                } else {
                    $("#hasil").html(
                        "<p style='color:red'>" +
                        response.message + "</p>"
                    );
                }
            },

            error: function(xhr) {
                let message = "Terjadi kesalahan saat mengirim data.";

                try {
                    let response = JSON.parse(xhr.responseText);
                    message = response.message || message;
                } catch (e) {}

                $("#hasil").html(
                    "<p style='color:red'>" + message + "</p>"
                );
            }
        });
    });
});
</script>
</body>
</html>
